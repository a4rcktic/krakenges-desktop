apply plugin: 'com.android.application'

// ¿Hay credenciales de firma disponibles? Se evalúa fuera del bloque android
// porque buildTypes lo consulta. Sin esto, release usaría signingConfigs.release
// aunque el bloque no se hubiera configurado (queda con storeFile nulo).
def krakengesKeystoreProps = rootProject.file("keystore.properties")
def hasReleaseSigning = krakengesKeystoreProps.exists()

android {
    namespace = "com.krakenges.fleet"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.krakenges.fleet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "1.0.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            // Credenciales SIEMPRE desde android/keystore.properties (en .gitignore).
            // Hasta el 30/09 la clave de release y su contrasena estaban
            // hardcodeadas aqui y en un archivo versionado: cualquiera que clonara
            // el repo podia firmar APKs como Kraken Ges. La app aun no esta en Play
            // Store, asi que la clave se roto sin coste de migracion.
            if (hasReleaseSigning) {
                def props = new Properties()
                krakengesKeystoreProps.withInputStream { props.load(it) }
                storeFile file(props['storeFile'])
                storePassword props['storePassword']
                keyAlias props['keyAlias']
                keyPassword props['keyPassword']
                v1SigningEnabled true
                v2SigningEnabled true
                v3SigningEnabled true
            } else {
                // Sin credenciales no se puede firmar el release. Fallar ruidosamente
                // (y no compilar con una clave por defecto) para no distribuir un APK
                // sin firmar pensando que sí lo está.
                logger.warn("[krakenges] No existe android/keystore.properties. Ver README-DEV.md § Android. El APK de release NO se firmara.")
            }
        }
    }
    buildTypes {
        // El build debug usa la clave de debug de Android automaticamente. Antes
        // reutilizaba la de release, lo que hacia que debug y release compitieran
        // por la misma instalacion (un debug no se podia instalar encima de un APK
        // real, y ademas forzaba tener el keystore de produccion para depurar).
        debug {
            // Paquete propio: el debug se instala junto a la app real sin
            // pisarla ni borrar sus datos (firmas distintas, mismo id = conflicto).
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            // Se empareja con signingConfigs.release solo si keystore.properties
            // existe. Si no, el release sale SIN firmar en vez de usar una clave suelta.
            signingConfig hasReleaseSigning ? signingConfigs.release : null
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

