name: Build Windows Desktop

on:
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows NSIS/MSI
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-client-desktop-and-mobile/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app-client-desktop-and-mobile/src-tauri -> target

      - name: Install frontend dependencies
        working-directory: app-client-desktop-and-mobile
        run: npm install

      - name: Check brand
        working-directory: ${{ github.workspace }}
        run: node tools/brand/apply.mjs --check

      - name: Build frontend
        working-directory: app-client-desktop-and-mobile
        run: npm run build

      - name: Build Tauri Windows bundles
        working-directory: app-client-desktop-and-mobile
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles nsis,msi

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            app-client-desktop-and-mobile/src-tauri/target/release/bundle/nsis/*.exe
            app-client-desktop-and-mobile/src-tauri/target/release/bundle/msi/*.msi
          retention-days: 7
