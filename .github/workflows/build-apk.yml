name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Android APK (Capacitor)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-client-desktop-and-mobile/package-lock.json

      - name: Restore keystore from secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Falta ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          ANDROID_DIR=app-client-desktop-and-mobile/android
          mkdir -p "$ANDROID_DIR/app"
          echo "$KEYSTORE_B64" | base64 -d > "$ANDROID_DIR/app/release.keystore"
          printf "storeFile=release.keystore\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n" \
            "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > "$ANDROID_DIR/keystore.properties"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Install frontend dependencies
        working-directory: app-client-desktop-and-mobile
        run: npm install

      - name: Check brand
        working-directory: ${{ github.workspace }}
        run: node tools/brand/apply.mjs --check

      - name: Build frontend
        working-directory: app-client-desktop-and-mobile
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: app-client-desktop-and-mobile
        run: npx cap sync android

      - name: Build release APK
        working-directory: app-client-desktop-and-mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app-client-desktop-and-mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 7
