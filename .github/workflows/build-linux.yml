name: Build Linux Desktop

on:
  workflow_dispatch:

jobs:
  build-linux:
    name: Linux AppImage/deb
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-client-desktop-and-mobile/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./app-client-desktop-and-mobile/src-tauri -> target

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: app-client-desktop-and-mobile
        run: npm install

      - name: Check brand
        working-directory: ${{ github.workspace }}
        run: node tools/brand/apply.mjs --check

      - name: Build frontend
        working-directory: app-client-desktop-and-mobile
        run: npm run build

      - name: Build Tauri Linux bundles
        working-directory: app-client-desktop-and-mobile
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build --bundles appimage,deb

      - name: Upload installers as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            app-client-desktop-and-mobile/src-tauri/target/release/bundle/appimage/*.AppImage
            app-client-desktop-and-mobile/src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
