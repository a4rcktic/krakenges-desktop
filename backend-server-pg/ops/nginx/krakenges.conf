# ---------------------------------------------------------------------------
# Kraken Ges — nginx delante del backend Node.
#
# Sustituye krakenges.example por el dominio real y ajusta las rutas de
# certificados. Este fichero asume que se incluye desde el bloque `http {}`
# (por ejemplo /etc/nginx/sites-enabled/krakenges.conf).
#
# El backend escucha en 127.0.0.1:4000; nginx termina TLS y añade HSTS.
# ---------------------------------------------------------------------------

upstream krakenges_backend {
    server 127.0.0.1:4000;
    keepalive 32;
}

# Límite propio de nginx. Express acepta JSON de hasta 15 MB para los estados
# de navegador; deja margen para las cabeceras.
limit_req_zone $binary_remote_addr zone=krakenges_api:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name krakenges.example www.krakenges.example;

    # Certbot puede necesitar este path antes de emitir el certificado.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name krakenges.example www.krakenges.example;

    ssl_certificate     /etc/letsencrypt/live/krakenges.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/krakenges.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 16m;
    client_body_timeout 30s;
    client_header_timeout 15s;

    access_log /var/log/nginx/krakenges.access.log;
    error_log  /var/log/nginx/krakenges.error.log warn;

    location /api/ {
        limit_req zone=krakenges_api burst=40 nodelay;

        proxy_pass http://krakenges_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location = /health {
        proxy_pass http://krakenges_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    location / {
        # El frontend se sirve aparte (Tauri/web). Si quieres servirlo desde
        # nginx, cambia este return por un root con try_files.
        return 404;
    }
}
